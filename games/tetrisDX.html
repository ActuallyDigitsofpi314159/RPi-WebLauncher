<style>
html,body{
    margin:0;width:100%;height:100%;overflow:hidden;
    background:#000;color:#eef3ff;font-family:monospace;
}
body{display:flex;align-items:center;justify-content:center}
#game{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#000;outline:none;
}
#screen{
    display:block;
    width:min(100vw,111.111vh);
    height:min(100vh,90vw);
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#000;
}
#panel{
    position:fixed;left:14px;top:14px;z-index:10;
    width:310px;max-width:calc(100vw - 46px);
    padding:14px 14px 12px;
    background:rgba(10,14,22,.94);
    border:1px solid #34405a;
    border-radius:10px;
    box-shadow:0 12px 38px rgba(0,0,0,.55);
    opacity:0;visibility:hidden;transform:translateY(-6px);
    transition:opacity .12s ease,transform .12s ease,visibility .12s;
}
#panel.show{opacity:1;visibility:visible;transform:translateY(0)}
#panel h1{font-size:15px;margin:0 0 9px}
#panel .hint{font-size:11px;color:#9eabc1;margin:0 0 9px;line-height:1.4}
button{
    font:inherit;background:#20283a;color:#fff;
    border:1px solid #3b4864;border-radius:5px;
    padding:6px 9px;margin:2px;cursor:pointer
}
button:hover{background:#2a3650}
#status,#debug{
    white-space:pre-wrap;font-size:11px;line-height:1.38;
    background:#0b1019;border:1px solid #283249;
    padding:8px;margin-top:8px;border-radius:6px;
}
#status{color:#91f4a5}
#debug{color:#c7d2e5}
kbd{
    background:#20283a;border:1px solid #39445d;
    border-bottom-width:2px;border-radius:4px;padding:1px 4px
}

#playScreen{
    position:fixed;inset:0;z-index:30;
    display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.88);
    backdrop-filter:blur(5px);
}
#playScreen.hidden{display:none}
#playCard{
    width:min(430px,calc(100vw - 40px));
    padding:26px 24px 22px;
    box-sizing:border-box;
    text-align:center;
    border:1px solid #3b4864;
    border-radius:16px;
    background:#0d1320;
    box-shadow:0 18px 70px rgba(0,0,0,.7);
}
.playTitle{
    font-size:34px;font-weight:bold;letter-spacing:4px;
    margin-bottom:5px;
}
.playSub{
    color:#94a2bb;font-size:11px;margin-bottom:22px;
}
.controlsGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 12px;
    margin-bottom:22px;
}
.controlsGrid div{
    display:flex;align-items:center;justify-content:space-between;
    gap:10px;padding:8px 9px;
    background:#121a29;border:1px solid #28344b;border-radius:7px;
}
.controlsGrid span{color:#b9c4d7;font-size:11px}
#playButton{
    width:100%;font-size:18px;font-weight:bold;
    padding:12px 0;margin:0;
    background:#e8edf7;color:#090d14;border:0;border-radius:8px;
}
#playButton:hover{background:#fff}
#audioHint{
    margin-top:10px;color:#77869f;font-size:10px;
}

</style>
</head>

<script>
(function () {
    var el=document.getElementById("dkgb_payload");
    var b64=el.value||el.textContent||"";
    var bin=atob(b64);
    var input=new Uint8Array(bin.length);
    var out=[];
    var i,p,flags,bit,b1,b2,dist,len,j,srcPos;
    var bytes,text,s,k,end,chunk;
    
    for(i=0;i<bin.length;i++){input[i]=bin.charCodeAt(i);}
    
    p=0;
    while(p<input.length){
        flags=input[p++];
        for(bit=0;bit<8&&p<input.length;bit++){
            if(flags&(1<<bit)){
                out.push(input[p++]);
            }else{
                if(p+1>=input.length){break;}
                b1=input[p++];
                b2=input[p++];
                dist=(b1<<4)|(b2>>4);
                len=(b2&15)+3;
                srcPos=out.length-dist;
                for(j=0;j<len;j++){out.push(out[srcPos+j]);}
            }
        }
    }
    
    bytes=new Uint8Array(out);
    if(window.TextDecoder){
        text=new TextDecoder("utf-8").decode(bytes);
    }else{
        s="";
        chunk=8192;
        for(k=0;k<bytes.length;k+=chunk){
            end=Math.min(k+chunk,bytes.length);
            for(i=k;i<end;i++){s+=String.fromCharCode(bytes[i]);}
        }
        text=decodeURIComponent(escape(s));
    }
    
    el.parentNode.removeChild(el);
    (0,eval)(text);
}());
</script>
