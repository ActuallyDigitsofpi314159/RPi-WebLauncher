<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SM64 Web</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
}

#game-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

canvas {
    display: block;
}
/* Google Fonts */
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700;800&display=swap');

:root{
    --bg:#090a10;
    --surface:#11131c;
    --surface2:#171a25;
    --line:#272a38;
    --text:#f5f4f0;
    --muted:#9294a5;
    --accent:#b8f279;
    --accent2:#8b7cff;
}

#start{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    overflow:hidden;
    z-index:100;
    font-family:Manrope,sans-serif;
}

.ambient{
    position:absolute;
    width:520px;
    height:520px;
    border-radius:50%;
    filter:blur(110px);
    opacity:.12;
}

.ambient-one{
    top:-220px;
    right:-120px;
    background:var(--accent2);
}

.ambient-two{
    bottom:-260px;
    left:-180px;
    background:var(--accent);
}

.start-card{
    width:min(560px,90vw);
    padding:42px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.45);
    text-align:center;
}

.eyebrow{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-bottom:18px;

    color:var(--accent);
    font:500 10px "DM Mono",monospace;
    letter-spacing:.22em;
}

.eyebrow-line{
    width:26px;
    height:1px;
    background:var(--accent);
}

.start-card h1{
    margin:0;
    color:var(--text);
    font-size:56px;
    line-height:1;
    letter-spacing:-.06em;
    font-weight:800;
}

.start-card h1 em{
    color:var(--accent);
    font-style:normal;
}

.start-card p{
    margin:24px auto 34px;
    max-width:420px;
    color:var(--muted);
    line-height:1.8;
    font-size:14px;
}

#start-btn{
    border:0;
    border-radius:12px;
    padding:16px 34px;
    cursor:pointer;

    background:var(--accent);
    color:#111;

    font:700 16px Manrope,sans-serif;

    transition:.25s;
}

#start-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 12px 35px rgba(184,242,121,.35);
}

.controls{
    margin-top:30px;

    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:14px;

    color:var(--muted);
    font:11px "DM Mono",monospace;
}

.controls b{
    color:var(--text);
}
</style>
</head>
<body>

<div id="game-container">
    <canvas id="canvas"></canvas>
</div>

<div id="start">
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>

    <div class="start-card">
        <div class="eyebrow">
            <span class="eyebrow-line"></span>
            A 1996 Classic
        </div>

        <h1>SUPER <em>MARIO 64</em></h1>

        <p>
            The classic Nintendo 64 platformer directly from your browser with quality-of-life additions.
        </p>

        <button id="start-btn">
            ▶ Launch Game
        </button>

        <div class="controls">
            <span><b>Move</b> WASD</span>
            <span><b>Jump</b> Space</span>
            <span><b>Punch</b> E / Click</span>
            <span><b>Crouch</b> Shift</span>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const container = document.getElementById("game-container");

/* ================= FIXED SAFE RES ================= */
canvas.width = 1280;
canvas.height = 720;

/* ================= 16:9 LETTERBOX ================= */
function resize() {
    const target = 16 / 9;
    const w = window.innerWidth;
    const h = window.innerHeight;

    let displayW, displayH;

    if (w / h > target) {
        displayH = h;
        displayW = h * target;
    } else {
        displayW = w;
        displayH = w / target;
    }

    container.style.width = displayW + "px";
    container.style.height = displayH + "px";

    canvas.style.width = displayW + "px";
    canvas.style.height = displayH + "px";
}
window.addEventListener("resize", resize);
resize();

/* ================= INPUT SWAP ================= */
const keyMap = {
    KeyW: "ArrowUp",
    KeyA: "ArrowLeft",
    KeyS: "ArrowDown",
    KeyD: "ArrowRight",

    ArrowUp: "KeyW",
    ArrowLeft: "KeyA",
    ArrowDown: "KeyS",
    ArrowRight: "KeyD",

    Space: "KeyX",
    ShiftLeft: "Space",
    KeyE: "KeyC"
};

const keyCode = {
    ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39,
    KeyW: 87, KeyA: 65, KeyS: 83, KeyD: 68,
    KeyX: 88, KeyC: 67, Space: 32
};

const origAdd = EventTarget.prototype.addEventListener;

EventTarget.prototype.addEventListener = function(type, listener, opts) {
    if (type === "keydown" || type === "keyup") {
        const wrapped = function(e) {
            const mapped = keyMap[e.code];

            if (mapped) {
                const fake = new KeyboardEvent(type, {
                    code: mapped,
                    keyCode: keyCode[mapped],
                    which: keyCode[mapped],
                    bubbles: true
                });
                return listener.call(this, fake);
            }
            return listener.call(this, e);
        };
        return origAdd.call(this, type, wrapped, opts);
    }
    return origAdd.call(this, type, listener, opts);
};

/* mouse → punch */
document.addEventListener("mousedown", e => {
    if (e.button === 0) {
        document.dispatchEvent(new KeyboardEvent("keydown", { code: "KeyC", keyCode: 67 }));
    }
});
document.addEventListener("mouseup", e => {
    if (e.button === 0) {
        document.dispatchEvent(new KeyboardEvent("keyup", { code: "KeyC", keyCode: 67 }));
    }
});

/* ================= START ================= */
document.getElementById("start-btn").addEventListener("click", async () => {

    // unlock audio FIRST (must be inside user gesture)
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        await ctx.resume();
    } catch (e) {
        console.warn("Audio init failed:", e);
    }

    // setup module BEFORE loading script
    window.Module = {
        canvas: canvas
    };

    // load game
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/gh/ArkShocer/sm64@main/sm64.us.f3dex2e.js";
    script.async = true;

    script.onload = () => {
        console.log("SM64 loaded");
    };

    script.onerror = () => {
        alert("Failed to load SM64 script.");
    };

    document.body.appendChild(script);

    // hide UI AFTER starting load (so it doesn't block clicks)
    document.getElementById("start").style.display = "none";
});
</script>

</body>
</html>
